[package]
name = "nexora-token"
version = "1.0.0"
edition = "2021"
publish = false
description = "NEXORA fixed-supply SEP-41 token (OpenZeppelin Stellar contracts)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"
stellar-tokens = "=0.8.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
